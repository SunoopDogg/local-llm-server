services:
  vllm:
    profiles: ["vllm"]
    build: .
    volumes:
      - ./models:/root/.cache/huggingface
    network_mode: host
    command:
      - ${VLLM_MODEL_NAME}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME}
      - --dtype=${VLLM_DTYPE:-auto}
      - --quantization=${VLLM_QUANTIZATION}
      - --tensor-parallel-size=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-auto}
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_TOOL_CALL_PARSER}
      - --reasoning-parser=${VLLM_REASONING_PARSER}
      - --host=0.0.0.0
      - --port=${PORT}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    volumes:
      - ./models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:${PORT}
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-cpp:
    profiles: ["llama-cpp"]
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models:/models
    network_mode: host
    command:
      - --model=${LLAMACPP_MODEL_PATH}
      - --gpu-layers=${LLAMACPP_GPU_LAYERS}
      - --ctx-size=${LLAMACPP_CONTEXT_SIZE}
      - --host=0.0.0.0
      - --port=${PORT}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
